<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 魔方 · Rubik's Cube</title>
<style>
  :root{
    --bg-1:#191a1f;
    --bg-2:#0b0c0f;
    --ink:#e9e7e0;
    --ink-dim:#8b8a84;
    --line:#2e2f36;
    --accent:#f5b301;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:radial-gradient(120% 90% at 50% 30%, var(--bg-1) 0%, var(--bg-2) 70%);
    color:var(--ink);
    user-select:none;
  }
  #stage{position:fixed;inset:0;touch-action:none;}
  header{
    position:fixed;top:28px;left:32px;z-index:10;pointer-events:none;
  }
  header h1{
    font-size:26px;font-weight:700;letter-spacing:.08em;
  }
  header h1 span{color:var(--accent);}
  header p{
    margin-top:6px;font-size:12px;letter-spacing:.28em;color:var(--ink-dim);
  }
  #status{
    position:fixed;top:32px;right:32px;z-index:10;text-align:right;
    font-size:13px;color:var(--ink-dim);letter-spacing:.1em;
  }
  #status b{color:var(--ink);font-variant-numeric:tabular-nums;}
  #solved{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
    z-index:20;pointer-events:none;
    font-size:42px;font-weight:800;letter-spacing:.2em;color:var(--accent);
    opacity:0;transition:opacity .35s ease,transform .35s ease;
    text-shadow:0 4px 40px rgba(245,179,1,.35);
  }
  #solved.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  #panel{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:10;display:flex;flex-direction:column;align-items:center;gap:14px;
    width:min(560px,92vw);
  }
  #hint{
    font-size:12px;color:var(--ink-dim);letter-spacing:.12em;text-align:center;
  }
  #moves{
    display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%;
  }
  #moves button{
    appearance:none;background:transparent;border:1px solid var(--line);
    color:var(--ink);font:600 14px/1 "SF Mono",Menlo,Consolas,monospace;
    padding:11px 0;border-radius:8px;cursor:pointer;
    transition:border-color .15s,color .15s,background .15s;
  }
  #moves button:hover{border-color:var(--accent);color:var(--accent);}
  #moves button:active{background:rgba(245,179,1,.12);}
  #actions{display:flex;gap:10px;width:100%;}
  #actions button{
    flex:1;appearance:none;border-radius:8px;cursor:pointer;
    padding:12px 0;font-size:14px;font-weight:600;letter-spacing:.15em;
    transition:filter .15s,background .15s,border-color .15s;
  }
  #scramble{background:var(--accent);border:1px solid var(--accent);color:#141414;}
  #scramble:hover{filter:brightness(1.08);}
  #reset{background:transparent;border:1px solid var(--line);color:var(--ink);}
  #reset:hover{border-color:var(--ink);}
  @media (max-width:520px){
    header{top:18px;left:20px;}
    header h1{font-size:20px;}
    #status{top:20px;right:20px;font-size:12px;}
    #solved{font-size:30px;}
    #panel{bottom:16px;gap:10px;}
    #moves button{padding:9px 0;font-size:13px;}
  }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <h1>魔方 <span>×</span> 3D</h1>
  <p>RUBIK'S CUBE</p>
</header>

<div id="status">步数 <b id="moveCount">0</b></div>
<div id="solved">已复原！</div>

<div id="panel">
  <div id="hint">拖动魔方表面 · 转动一层　|　拖动空白处 · 旋转视角</div>
  <div id="moves"></div>
  <div id="actions">
    <button id="scramble">打　乱</button>
    <button id="reset">复　原</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- 场景 ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, .1, 100);
camera.position.set(6.4, 5.2, 7.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 16;

scene.add(new THREE.HemisphereLight(0xffffff, 0x30323a, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 9, 7);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db4ff, .5);
rim.position.set(-7, -3, -6);
scene.add(rim);

/* ---------- 魔方 ---------- */
const FACE = { // 世界方向 → 颜色
  px:0xB71234, nx:0xFF5800,  // 右红 左橙
  py:0xFFFFFF, ny:0xFFD500,  // 上白 下黄
  pz:0x009B48, nz:0x0046AD   // 前绿 后蓝
};
const cubeGroup = new THREE.Group();
cubeGroup.position.y = .95;
scene.add(cubeGroup);
controls.target.set(0, .95, 0);

const bodyGeo  = new RoundedBoxGeometry(.96, .96, .96, 4, .07);
const stickGeo = new RoundedBoxGeometry(.8, .8, .06, 2, .025);
const bodyMat  = new THREE.MeshStandardMaterial({ color:0x141519, roughness:.55, metalness:.05 });

let cubies = [];

function buildCube(){
  for(const c of cubies){ cubeGroup.remove(c); }
  cubies = [];
  for(let x=-1;x<=1;x++) for(let y=-1;y<=1;y++) for(let z=-1;z<=1;z++){
    const cubie = new THREE.Mesh(bodyGeo, bodyMat);
    cubie.position.set(x, y, z);
    cubie.userData.isCubie = true;
    cubie.userData.stickers = [];
    const dirs = [
      ['px', new THREE.Vector3(1,0,0)], ['nx', new THREE.Vector3(-1,0,0)],
      ['py', new THREE.Vector3(0,1,0)], ['ny', new THREE.Vector3(0,-1,0)],
      ['pz', new THREE.Vector3(0,0,1)], ['nz', new THREE.Vector3(0,0,-1)]
    ];
    for(const [k, dir] of dirs){
      const coord = x*dir.x + y*dir.y + z*dir.z;
      if(coord !== 1) continue;
      const mat = new THREE.MeshStandardMaterial({ color:FACE[k], roughness:.32, metalness:0 });
      const s = new THREE.Mesh(stickGeo, mat);
      s.position.copy(dir).multiplyScalar(.485);
      if(dir.x) s.rotation.y = Math.PI/2 * dir.x;
      if(dir.y) s.rotation.x = -Math.PI/2 * dir.y;
      if(dir.z === -1) s.rotation.y = Math.PI;
      s.userData.cubie = cubie;
      cubie.add(s);
      cubie.userData.stickers.push({ dir: dir.clone(), color: FACE[k] });
    }
    cubie.userData.cubie = cubie;
    cubeGroup.add(cubie);
    cubies.push(cubie);
  }
}
buildCube();

/* ---------- 转动逻辑 ---------- */
const queue = [];
let active = null;          // 正在播放的动画
let moveCount = 0;
let scrambled = false;
const countEl = document.getElementById('moveCount');
const solvedEl = document.getElementById('solved');

function enqueue(axisVec, layer, angle){
  queue.push({ axisVec, layer, angle });
  pump();
}
function pump(){
  if(active || !queue.length) return;
  const m = queue.shift();
  startMove(m);
}
function startMove({ axisVec, layer, angle }){
  const abs = new THREE.Vector3(Math.abs(axisVec.x), Math.abs(axisVec.y), Math.abs(axisVec.z));
  const pivot = new THREE.Group();
  cubeGroup.add(pivot);
  for(const c of cubies){
    if(Math.round(c.position.dot(abs)) === layer) pivot.add(c);
  }
  active = { pivot, axisVec, angle, t:0, dur:.26 };
  moveCount++;
  countEl.textContent = moveCount;
  solvedEl.classList.remove('show');
}
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

function finishMove(){
  const { pivot, axisVec, angle } = active;
  const q = new THREE.Quaternion().setFromAxisAngle(axisVec, angle);
  pivot.updateMatrixWorld(true);
  for(const c of [...pivot.children]){
    cubeGroup.attach(c);
    c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
    snapQuaternion(c);
  }
  cubeGroup.remove(pivot);
  active = null;
  checkSolved();
  pump();
}
function snapQuaternion(obj){
  const m = new THREE.Matrix4().makeRotationFromQuaternion(obj.quaternion);
  const e = m.elements;
  for(const c of [0, 4, 8]){
    const v = new THREE.Vector3(e[c], e[c+1], e[c+2]);
    const ax = Math.abs(v.x), ay = Math.abs(v.y), az = Math.abs(v.z);
    if(ax >= ay && ax >= az) v.set(Math.sign(v.x) || 1, 0, 0);
    else if(ay >= az)        v.set(0, Math.sign(v.y) || 1, 0);
    else                     v.set(0, 0, Math.sign(v.z) || 1);
    e[c] = v.x; e[c+1] = v.y; e[c+2] = v.z;
  }
  obj.quaternion.setFromRotationMatrix(m);
}

function checkSolved(){
  if(!scrambled) return;
  const v = new THREE.Vector3();
  for(const c of cubies){
    for(const st of c.userData.stickers){
      v.copy(st.dir).applyQuaternion(c.quaternion);
      const wx = Math.round(v.x), wy = Math.round(v.y), wz = Math.round(v.z);
      if(wx !== st.dir.x || wy !== st.dir.y || wz !== st.dir.z) return;
    }
  }
  solvedEl.classList.add('show');
  scrambled = false;
}

/* ---------- 按钮 ---------- */
const HALF = Math.PI/2;
const MOVES = {
  "U":  [new THREE.Vector3(0,1,0),  1, -HALF], "U'": [new THREE.Vector3(0,1,0),  1,  HALF],
  "D":  [new THREE.Vector3(0,1,0), -1,  HALF], "D'": [new THREE.Vector3(0,1,0), -1, -HALF],
  "R":  [new THREE.Vector3(1,0,0),  1, -HALF], "R'": [new THREE.Vector3(1,0,0),  1,  HALF],
  "L":  [new THREE.Vector3(1,0,0), -1,  HALF], "L'": [new THREE.Vector3(1,0,0), -1, -HALF],
  "F":  [new THREE.Vector3(0,0,1),  1, -HALF], "F'": [new THREE.Vector3(0,0,1),  1,  HALF],
  "B":  [new THREE.Vector3(0,0,1), -1,  HALF], "B'": [new THREE.Vector3(0,0,1), -1, -HALF],
};
const movesEl = document.getElementById('moves');
for(const name of Object.keys(MOVES)){
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { const [a, l, ang] = MOVES[name]; scrambled = true; enqueue(a, l, ang); };
  movesEl.appendChild(b);
}

document.getElementById('scramble').onclick = () => {
  const faces = ['U','D','L','R','F','B'];
  let prev = '';
  for(let i=0;i<20;i++){
    let f;
    do { f = faces[Math.floor(Math.random()*6)]; } while(f === prev);
    prev = f;
    const name = f + (Math.random() < .5 ? "'" : '');
    const [a, l, ang] = MOVES[name];
    enqueue(a, l, ang);
  }
  scrambled = true;
  moveCount = 0;
  countEl.textContent = 0;
  solvedEl.classList.remove('show');
};

document.getElementById('reset').onclick = () => {
  queue.length = 0;
  if(active){ cubeGroup.remove(active.pivot); active = null; }
  buildCube();
  scrambled = false;
  moveCount = 0;
  countEl.textContent = 0;
  solvedEl.classList.remove('show');
};

/* ---------- 拖动转层 ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let drag = null;

function setRay(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(pointer, camera);
}
function snapAxis(v){
  const ax = Math.abs(v.x), ay = Math.abs(v.y), az = Math.abs(v.z);
  if(ax >= ay && ax >= az) return new THREE.Vector3(Math.sign(v.x), 0, 0);
  if(ay >= az)             return new THREE.Vector3(0, Math.sign(v.y), 0);
  return new THREE.Vector3(0, 0, Math.sign(v.z));
}

renderer.domElement.addEventListener('pointerdown', e => {
  if(e.button !== undefined && e.button !== 0) return;
  setRay(e);
  const hit = raycaster.intersectObjects(cubies, true)[0];
  if(!hit) return;                       // 空白处 → 交给 OrbitControls
  controls.enabled = false;
  const normal = snapAxis(hit.face.normal.clone().transformDirection(hit.object.matrixWorld));
  drag = {
    cubie: hit.object.userData.cubie,
    normal,
    point: hit.point.clone(),
    started: false
  };
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', e => {
  if(!drag || drag.started) return;
  setRay(e);
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(drag.normal, drag.point);
  const cur = new THREE.Vector3();
  if(!raycaster.ray.intersectPlane(plane, cur)) return;
  const vec = cur.sub(drag.point);
  if(vec.length() < .28) return;

  // 面内两个候选方向，取拖动分量更大的那个
  const n = drag.normal;
  const cands = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)]
    .filter(a => Math.abs(a.dot(n)) < .5);
  let d = cands[0];
  if(Math.abs(vec.dot(cands[1])) > Math.abs(vec.dot(cands[0]))) d = cands[1];
  d = d.clone().multiplyScalar(Math.sign(vec.dot(d)));

  const rotAxis = new THREE.Vector3().crossVectors(n, d);   // 带符号的单位轴
  const abs = new THREE.Vector3(Math.abs(rotAxis.x), Math.abs(rotAxis.y), Math.abs(rotAxis.z));
  const layer = Math.round(drag.cubie.position.dot(abs));
  drag.started = true;
  enqueue(rotAxis, layer, HALF);                            // 绕带符号轴转 +90°，跟随手指方向
  scrambled = true;
});

function endDrag(e){
  if(drag){
    drag = null;
    try{ renderer.domElement.releasePointerCapture(e.pointerId); }catch(_){}
  }
  controls.enabled = true;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

/* ---------- 渲染循环 ---------- */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05);
  if(active){
    active.t += dt;
    const k = ease(Math.min(active.t / active.dur, 1));
    active.pivot.setRotationFromAxisAngle(active.axisVec, active.angle * k);
    if(active.t >= active.dur) finishMove();
  }
  controls.update();
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
